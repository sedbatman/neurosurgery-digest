<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | neurosurgery.digest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Post Page Specific Styles */
        .post-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            min-height: calc(100vh - 200px);
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition);
            margin-bottom: 2rem;
        }

        .back-button:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        /* Article Container */
        .article-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 3rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .article-header {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .article-title {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.5;
            margin-bottom: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .meta-icon {
            font-size: 1rem;
        }

        .meta-label {
            color: var(--text-secondary);
        }

        .meta-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Article Content */
        .article-content {
            font-size: 1.1rem;
            line-height: 2;
            color: var(--text-primary);
        }

        .article-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-tertiary);
            margin: 2.5rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-primary);
        }

        .article-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 2rem 0 1rem 0;
        }

        .article-content p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .article-content ul, .article-content ol {
            margin: 1rem 0 1.5rem 0;
            padding-right: 2rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
            line-height: 1.8;
        }

        .article-content blockquote {
            background: var(--bg-tertiary);
            border-right: 4px solid var(--accent-primary);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 0 12px 12px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .article-content strong {
            color: var(--accent-tertiary);
            font-weight: 600;
        }

        /* Table of Contents Sidebar */
        .toc-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .toc-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .toc-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-tertiary);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .toc-list {
            list-style: none;
        }

        .toc-list li {
            margin-bottom: 0.75rem;
        }

        .toc-list a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: block;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            transition: var(--transition);
            border-right: 2px solid transparent;
        }

        .toc-list a:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-right-color: var(--accent-primary);
        }

        .toc-list a.active {
            background: var(--bg-tertiary);
            color: var(--accent-tertiary);
            border-right-color: var(--accent-primary);
            font-weight: 500;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error State */
        .error-container {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .post-page {
                grid-template-columns: 1fr;
            }

            .toc-sidebar {
                position: static;
                order: -1;
            }
        }

        @media (max-width: 768px) {
            .article-container {
                padding: 1.5rem;
            }

            .article-title {
                font-size: 1.5rem;
            }

            .article-meta {
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        @media print {
            .toc-sidebar {
                display: none;
            }

            .post-page {
                grid-template-columns: 1fr;
                padding: 0;
            }

            .article-container {
                background: white;
                border: none;
                padding: 0;
            }

            .article-title {
                background: none;
                -webkit-text-fill-color: #333;
                color: #333;
            }

            .article-content {
                color: #333;
            }

            .article-content h2 {
                color: #333;
                border-bottom-color: #333;
            }

            .back-button {
                background: white;
                color: #333;
                border-color: #333;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative Background Elements -->
    <div class="bg-decoration">
        <div class="neuron neuron-1"></div>
        <div class="neuron neuron-2"></div>
        <div class="neuron neuron-3"></div>
    </div>

    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <div class="logo-text">
                    <a href="index.html" class="site-name" style="text-decoration: none;">neurosurgery.digest</a>
                    <p class="site-subtitle">مروری بر مهم‌ترین مقالات نوروسرجری</p>
                </div>
            </div>
            <div class="header-decoration">
                <span class="spine-icon">🦴</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="post-page">
        <!-- Article Container -->
        <div id="articleContainer" class="article-container">
            <div class="loading">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Table of Contents Sidebar -->
        <aside id="tocSidebar" class="toc-sidebar" style="display: none;">
            <div class="toc-container">
                <h3 class="toc-title">📑 فهرست مطالب</h3>
                <ul id="tocList" class="toc-list">
                    <!-- TOC items will be generated here -->
                </ul>
            </div>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p class="copyright">© ۱۴۰۵ neurosurgery.digest | ساخته شده با ❤️ برای علاقه‌مندان به نوروسرجری</p>
            <p class="doctor-credit">دکتر علیرضا | آینده جراح ستون فقرات</p>
        </div>
    </footer>

    <script>
        // Get slug from URL
        function getSlug() {
            const params = new URLSearchParams(window.location.search);
            return params.get('slug');
        }

        // Format Persian date
        function formatDate(dateStr) {
            const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
            const date = new Date(dateStr);
            const persianYear = date.getFullYear() + 621;
            const persianMonth = months[date.getMonth()];
            const persianDay = date.getDate();
            return `${persianDay} ${persianMonth} ${persianYear}`;
        }

        // Get badge class based on study type
        function getBadgeClass(studyType) {
            const types = {
                'راهنمای بالینی': 'badge-guideline',
                'مطالعه مروری': 'badge-review',
                'کارآزمایی بالینی': 'badge-rct',
                'مطالعه کوهورت': 'badge-cohort',
                'مطالعه موردی': 'badge-case'
            };
            return types[studyType] || 'badge-default';
        }

        // Generate Table of Contents
        function generateTOC(content) {
            const headings = content.querySelectorAll('h2, h3');
            if (headings.length === 0) return null;

            const tocList = document.getElementById('tocList');
            const tocSidebar = document.getElementById('tocSidebar');
            
            headings.forEach((heading, index) => {
                const id = `section-${index}`;
                heading.id = id;
                
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = heading.textContent;
                
                if (heading.tagName === 'H3') {
                    a.style.paddingRight = '1.5rem';
                    a.style.fontSize = '0.85rem';
                }
                
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // Update active state
                    tocList.querySelectorAll('a').forEach(link => link.classList.remove('active'));
                    a.classList.add('active');
                });
                
                li.appendChild(a);
                tocList.appendChild(li);
            });

            tocSidebar.style.display = 'block';
            
            // Scroll spy
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const tocLink = tocList.querySelector(`a[href="#${id}"]`);
                        if (tocLink) {
                            tocList.querySelectorAll('a').forEach(link => link.classList.remove('active'));
                            tocLink.classList.add('active');
                        }
                    }
                });
            }, { rootMargin: '-100px 0px -60% 0px' });

            headings.forEach(heading => observer.observe(heading));
        }

        // Load post content
        async function loadPost() {
            const slug = getSlug();
            if (!slug) {
                showError('آدرس مقاله نامعتبر است.');
                return;
            }

            try {
                const [postsResponse, postResponse] = await Promise.all([
                    fetch('posts.json'),
                    fetch(`posts/${slug}.html`)
                ]);

                const posts = await postsResponse.json();
                const postMeta = posts.find(p => p.slug === slug);

                if (!postResponse.ok || !postMeta) {
                    showError('مقاله مورد نظر یافت نشد.');
                    return;
                }

                const postContent = await postResponse.text();
                renderPost(postMeta, postContent);
            } catch (error) {
                console.error('Error loading post:', error);
                showError('خطا در بارگذاری مقاله.');
            }
        }

        // Show error
        function showError(message) {
            document.getElementById('articleContainer').innerHTML = `
                <div class="error-container">
                    <div class="error-icon">❌</div>
                    <p class="error-message">${message}</p>
                    <a href="index.html" class="back-button">← بازگشت به صفحه اصلی</a>
                </div>
            `;
        }

        // Render post
        function renderPost(meta, content) {
            document.title = `${meta.title} | neurosurgery.digest`;
            
            document.getElementById('articleContainer').innerHTML = `
                <a href="index.html" class="back-button">← بازگشت به لیست مقالات</a>
                
                <article>
                    <header class="article-header">
                        <h1 class="article-title">${meta.title}</h1>
                        <div class="article-meta">
                            <span class="meta-item">
                                <span class="meta-icon">📅</span>
                                <span class="meta-label">تاریخ انتشار:</span>
                                <span class="meta-value">${formatDate(meta.date)}</span>
                            </span>
                            <span class="meta-item">
                                <span class="meta-icon">📚</span>
                                <span class="meta-label">مجله:</span>
                                <span class="meta-value">${meta.journal}</span>
                            </span>
                            <span class="meta-item">
                                <span class="meta-icon">🏷️</span>
                                <span class="meta-label">نوع مطالعه:</span>
                                <span class="study-badge ${getBadgeClass(meta.study_type)}">${meta.study_type}</span>
                            </span>
                            <span class="meta-item">
                                <span class="meta-icon">⏱️</span>
                                <span class="meta-label">زمان مطالعه:</span>
                                <span class="meta-value">${meta.reading_time || 5} دقیقه</span>
                            </span>
                        </div>
                    </header>
                    <div class="article-content">
                        ${content}
                    </div>
                </article>
            `;

            // Generate TOC
            generateTOC(document.querySelector('.article-content'));
        }

        // Initialize
        loadPost();
    </script>
</body>
</html>
