<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neurosurgery.digest | مروری بر مهم‌ترین مقالات نوروسرجری</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <div>
                    <div class="site-name">neurosurgery.digest</div>
                    <div class="site-subtitle">مروری بر مهم‌ترین مقالات نوروسرجری</div>
                </div>
            </div>
            <div class="header-decoration">🦴</div>
        </div>
    </header>

    <!-- Main -->
    <div class="container">

        <!-- Search & Filter -->
        <section class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="جستجو در دایجست‌ها...">
            <select id="studyTypeFilter" class="filter-select">
                <option value="">همه دایجست‌ها</option>
                <option value="مطالعه مروری">مطالعه مروری</option>
                <option value="کارآزمایی بالینی">کارآزمایی بالینی</option>
                <option value="مطالعه کوهورت">مطالعه کوهورت</option>
                <option value="مطالعه موردی">مطالعه موردی</option>
                <option value="راهنمای بالینی">راهنمای بالینی</option>
            </select>
        </section>

        <!-- Posts Grid -->
        <section id="postsGrid" class="posts-grid"></section>

        <!-- No Results -->
        <div id="noResults" class="no-results" style="display:none;">
            <p>دایجستی با این مشخصات یافت نشد.</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>در حال بارگذاری...</p>
        </div>

    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <p class="copyright">© ۱۴۰۵ neurosurgery.digest</p>
            <p class="credit">دکتر علیرضا | آینده جراح مغز و اعصاب</p>
        </div>
    </footer>

    <script>
    const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    function fmtDate(d) {
        const dt = new Date(d);
        return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()+621}`;
    }
    function badgeClass(t) {
        const m = {
            'راهنمای بالینی': 'badge-guideline',
            'مطالعه مروری': 'badge-review',
            'کارآزمایی بالینی': 'badge-rct',
            'مطالعه کوهورت': 'badge-cohort',
            'مطالعه موردی': 'badge-case'
        };
        return m[t] || 'badge-default';
    }

    let allPosts = [];

    async function loadPosts() {
        try {
            const r = await fetch('posts.json');
            allPosts = await r.json();
            document.getElementById('loading').style.display = 'none';
            render(allPosts);
        } catch(e) {
            document.getElementById('loading').innerHTML = '<p>خطا در بارگذاری</p>';
        }
    }

    function render(list) {
        const grid = document.getElementById('postsGrid');
        const none = document.getElementById('noResults');
        if (!list.length) {
            grid.innerHTML = '';
            none.style.display = 'block';
            return;
        }
        none.style.display = 'none';
        grid.innerHTML = list.map(p => `
            <article class="post-card" onclick="location.href='digest.html?slug=${p.slug}'">
                <div class="post-card-header">
                    <span class="post-date">${fmtDate(p.date)}</span>
                    <span class="post-badge">${p.study_type}</span>
                </div>
                <h2 class="post-card-title"><a href="digest.html?slug=${p.slug}">${p.title}</a></h2>
                <p class="post-card-summary">${p.summary}</p>
                <div class="post-card-footer">
                    <span>📚 ${p.journal}</span>
                    <span>⏱ ${p.reading_time || 5} دقیقه</span>
                </div>
            </article>
        `).join('');
    }

    function filter() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const t = document.getElementById('studyTypeFilter').value;
        render(allPosts.filter(p => {
            const matchSearch = !q || p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q);
            const matchType = !t || p.study_type === t;
            return matchSearch && matchType;
        }));
    }

    document.getElementById('searchInput').addEventListener('input', filter);
    document.getElementById('studyTypeFilter').addEventListener('change', filter);

    loadPosts();
    </script>
</body>
</html>
